    <div id="lightbox" class="lightbox">

        <button class="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-prev" aria-label="Previous image">&#10094;</button>
    
        <div class="lightbox-content">
            <img id="lightbox-image" src="" alt="">
    
            <div id="lightbox-text">
                <div class="caption-main"></div>
                <div class="caption-extra"></div>
            </div>
        </div>
    
        <button class="lightbox-next" aria-label="Next image">&#10095;</button>
    
    </div>
    
    <script>

        const images = document.querySelectorAll(".chapter-pair img");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightbox-image");
        const lightboxText = document.getElementById("lightbox-text");
        const closeButton = document.querySelector(".lightbox-close");
        const prevButton = document.querySelector(".lightbox-prev");
        const nextButton = document.querySelector(".lightbox-next");
    
        let currentIndex = 0;
    
        function showImage(index) {
            currentIndex = (index + images.length) % images.length;
    
            lightboxImage.src = images[currentIndex].src;
            lightboxImage.alt = images[currentIndex].alt;
    
            lightboxText.querySelector(".caption-main").textContent =
                        images[currentIndex].dataset.caption;

            lightboxText.querySelector(".caption-extra").textContent =
                        images[currentIndex].dataset.extra;
            lightboxText.querySelector(".caption-extra").style.display =
                        images[currentIndex].dataset.extra ? "block" : "none";
    
            lightbox.classList.add("active");
        }
    
        images.forEach((image, index) => {
            image.addEventListener("click", () => {
                showImage(index);
            });
        });
    
        function closeLightbox() {
            lightbox.classList.remove("active");
        }
    
        function showPrevious() {
            showImage(currentIndex - 1);
        }
    
        function showNext() {
            showImage(currentIndex + 1);
        }
    
        closeButton.addEventListener("click", closeLightbox);
        prevButton.addEventListener("click", showPrevious);
        nextButton.addEventListener("click", showNext);
    
        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });
    
        document.addEventListener("keydown", (event) => {
    
            if (!lightbox.classList.contains("active")) {
                return;
            }
    
            if (event.key === "Escape") {
                closeLightbox();
            }
    
            if (event.key === "ArrowLeft") {
                showPrevious();
            }
    
            if (event.key === "ArrowRight") {
                showNext();
            }
        });
    </script>
